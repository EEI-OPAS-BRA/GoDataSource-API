name: CI

on:
  pull_request:
    branches: [dev, homologacao]

permissions:
  contents: read

jobs:
  build:
    # Never self-hosted: anyone can open a pull request here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
