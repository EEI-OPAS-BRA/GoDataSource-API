name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target instance'
        type: choice
        options: [teste, opas]
        default: teste
      promote:
        description: 'Merge dev into homologacao before deploying (opas only)'
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a running deploy: aborting midway leaves the instance undefined.
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'teste' || inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.event_name == 'workflow_dispatch' && inputs.promote && inputs.environment == 'opas'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homologacao
          fetch-depth: 0

      - name: Merge dev into homologacao
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          # Merge, never rebase: deploy targets are pulled with --ff-only.
          git merge --no-edit origin/dev
          git push origin homologacao

  dispatch:
    needs: [promote]
    # Runs when promote is skipped, but still blocks on a failed promote.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      # The deploy runs in godata-ops, which is private. A self-hosted runner
      # writes the machine name and the workspace path into its job log, and
      # the logs of this repository are readable by anyone.
      - name: Trigger the deploy pipeline
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
          INSTANCE: ${{ github.event_name == 'push' && 'teste' || inputs.environment }}
        run: |
          jq -n --arg instance "$INSTANCE" \
            '{event_type: "deploy", client_payload: {component: "api", instance: $instance}}' |
            gh api --method POST repos/EEI-OPAS-BRA/godata-ops/dispatches --input -
