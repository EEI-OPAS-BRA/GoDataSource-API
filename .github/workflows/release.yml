name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release (for example v2026.10.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Never self-hosted: this repository is public.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/eei-opas-bra/godata
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
          path: api
          persist-credentials: false

      - name: Check the tag
        id: tag
        working-directory: api
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release tag (expected vYYYY.MM.P or vYYYY.MM.P-rc.N)"
            exit 1
          fi
          version="${TAG#v}"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag '$TAG' is not on main. Release tags are cut on main only."
            exit 1
          fi
          {
            echo "version=$version"
            echo "series=$(echo "$version" | cut -d. -f1,2)"
            if [[ "$version" == *-rc.* ]]; then echo "final=false"; else echo "final=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Decide which moving tags this version owns
        id: moving
        working-directory: api
        env:
          FINAL: ${{ steps.tag.outputs.final }}
          SERIES: ${{ steps.tag.outputs.series }}
        run: |
          is_highest_final() {
            local top
            top="$(git tag -l 'v*' | grep -E "$1" | sort -V | tail -n 1 || true)"
            [[ "$top" == "$TAG" ]]
          }
          latest=false
          series=false
          if [[ "$FINAL" == true ]]; then
            if is_highest_final '^v[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then latest=true; fi
            if is_highest_final "^v${SERIES//./\\.}\\.[0-9]+\$"; then series=true; fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          if [[ "$FINAL" == true && ( "$latest" != true || "$series" != true ) ]]; then
            echo "$TAG is not the highest final tag: latest moves=$latest, $SERIES moves=$series." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the Frontend tag and find the image source
        id: source
        working-directory: api
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          frontend_sha() {
            local type sha
            read -r type sha < <(gh api "repos/EEI-OPAS-BRA/GoDataSource-Frontend/git/ref/tags/$1" \
              --jq '.object.type + " " + .object.sha') || return 1
            while [[ "$type" == tag ]]; do
              read -r type sha < <(gh api "repos/EEI-OPAS-BRA/GoDataSource-Frontend/git/tags/$sha" \
                --jq '.object.type + " " + .object.sha') || return 1
            done
            echo "$sha"
          }
          inspect_state() {
            local out
            if out="$(docker buildx imagetools inspect "$1" 2>&1)"; then
              echo exists
            elif grep -qiE 'not found|manifest unknown|name unknown|no such manifest' <<< "$out"; then
              echo missing
            else
              echo "::error::Could not inspect $1: $out" >&2
              return 1
            fi
          }

          if ! frontend_final="$(frontend_sha "$TAG")"; then
            echo "::error::Tag '$TAG' does not exist in EEI-OPAS-BRA/GoDataSource-Frontend. Tag the Frontend first."
            exit 1
          fi

          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io > /dev/null 2>&1 || true' EXIT

          mode=build
          source=""
          state="$(inspect_state "$IMAGE:$VERSION")"
          if [[ "$state" == exists ]]; then
            mode=existing
          else
            while read -r candidate; do
              [[ -n "$candidate" && "$candidate" != "$TAG" ]] || continue
              state="$(inspect_state "$IMAGE:${candidate#v}")"
              if [[ "$state" == exists ]]; then
                source="${candidate#v}"
                break
              fi
            done < <(git tag --points-at "$(git rev-parse HEAD)" 'v*-rc.*' | sort -V -r)
            if [[ -n "$source" ]]; then
              if ! frontend_rc="$(frontend_sha "v$source")" || [[ "$frontend_rc" != "$frontend_final" ]]; then
                echo "::error::The Frontend tag v$source (${frontend_rc:-missing}) and $TAG ($frontend_final) point to different commits. The image of $source was validated with a different bundle, so it cannot be promoted. Retag the Frontend or drop the rc image."
                exit 1
              fi
              mode=promote
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: EEI-OPAS-BRA/GoDataSource-Frontend
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          path: frontend
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the package and the image
        if: steps.source.outputs.mode == 'build'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          api/deploy/release/build-artifacts.sh --api-dir api --frontend-dir frontend \
            --version "$VERSION" --out out --image --image-name "$IMAGE" --revision "$(git -C api rev-parse HEAD)"

      - name: Publish the image tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
          SERIES: ${{ steps.tag.outputs.series }}
          MODE: ${{ steps.source.outputs.mode }}
          SOURCE: ${{ steps.source.outputs.source }}
          MOVE_LATEST: ${{ steps.moving.outputs.latest }}
          MOVE_SERIES: ${{ steps.moving.outputs.series }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io > /dev/null 2>&1 || true' EXIT
          case "$MODE" in
            build)
              docker push "$IMAGE:$VERSION"
              ;;
            promote)
              docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:$SOURCE"
              echo "Image promoted from \`$SOURCE\` (same commit and same Frontend commit): \`$IMAGE:$VERSION\` is the image the pilots validated." >> "$GITHUB_STEP_SUMMARY"
              ;;
            existing)
              echo "Image \`$IMAGE:$VERSION\` already existed and was kept as it is." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
          moving=()
          if [[ "$MOVE_SERIES" == true ]]; then moving+=(-t "$IMAGE:$SERIES"); fi
          if [[ "$MOVE_LATEST" == true ]]; then moving+=(-t "$IMAGE:latest"); fi
          if ((${#moving[@]})); then
            docker buildx imagetools create "${moving[@]}" "$IMAGE:$VERSION"
          fi
          if [[ "$MODE" != build ]]; then
            docker pull "$IMAGE:$VERSION"
          fi

      - name: Re-pack the package and the image file
        if: steps.source.outputs.mode != 'build'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          api/deploy/release/build-artifacts.sh --api-dir api --frontend-dir frontend \
            --version "$VERSION" --out out
          image_file="godata-image-$VERSION.tar.gz"
          docker save "$IMAGE:$VERSION" | gzip > "out/$image_file"
          (cd out && sha256sum "$image_file" > "$image_file.sha256")

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
          FINAL: ${{ steps.tag.outputs.final }}
        run: |
          files=(
            "out/godata-$VERSION.tar.gz"
            "out/godata-$VERSION.tar.gz.sha256"
            "out/godata-image-$VERSION.tar.gz"
            "out/godata-image-$VERSION.tar.gz.sha256"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            flags=(--draft)
            if [[ "$FINAL" != true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes ""
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi
